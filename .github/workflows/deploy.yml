name: Deploy Tea Life Story to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install browser for verification
        run: npx playwright install --with-deps chromium
      - name: Verify Pages routes and offline behavior
        env:
          TEST_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run test:e2e
      - name: Build with Pages base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: VITE_BASE_PATH="${PAGES_BASE_PATH:-/}/" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
